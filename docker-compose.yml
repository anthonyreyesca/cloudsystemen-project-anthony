version: "3.8"

services:
  node-app:
    build: .
    container_name: node-app
    restart: always
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node-app
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
